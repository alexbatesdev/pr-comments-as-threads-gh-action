name: Threadify PR Comments & Cleanup

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: write        # create/update/delete __comment_threads.txt
  pull-requests: write   # create review comments
  issues: write          # edit/delete original PR comments

jobs:
  threadify_comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Threadify the new PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.issue.number;
            const comment = context.payload.comment;

            if ((comment.user?.type || "") === "Bot") { core.info("Skip bot"); return; }

            // 1) Get PR info
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const headRef = pr.head.ref;
            const headRepoFull = pr.head.repo.full_name;
            if (headRepoFull.toLowerCase() !== `${owner}/${repo}`.toLowerCase()) {
              core.warning("PR from fork; skipping (cannot push to fork).");
              return;
            }

            const filePath = "__comment_threads.txt";

            // 2) Read (or create) the file on the PR head branch; append a UNIX timestamp
            let existingSha, existingText = "";
            try {
              const { data: file } = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: headRef });
              if (Array.isArray(file)) throw new Error("Path is a directory");
              existingSha = file.sha;
              existingText = Buffer.from(file.content, file.encoding).toString("utf8");
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const lines = existingText ? existingText.split(/\r?\n/) : [];
            if (lines.length === 0) {
              lines.push("# Thread anchor – do not remove");
            }
            const timestamp = Math.floor(Date.now() / 1000);
            lines.push(String(timestamp));
            const newText = lines.join("\n").replace(/\n?$/, "\n");
            const contentB64 = Buffer.from(newText, "utf8").toString("base64");

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: filePath, branch: headRef,
              message: `chore: update ${filePath} for PR #${prNumber} comment ${comment.id}`,
              content: contentB64, sha: existingSha
            });

            // 3) Refresh PR to get the commit that includes the write we just made
            const { data: prAfter } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const commit_id = prAfter.head.sha; // REQUIRED by API

            // Prefer a FILE-level review comment to avoid diff hunk mapping issues.
            const body = `↪️ Mirrored from @${comment.user.login}:\n\n${comment.body}`;
            await new Promise(r => setTimeout(r, 1500));

            await github.rest.pulls.createReviewComment({
              owner, repo,
              pull_number: prNumber,
              commit_id,
              path: filePath,
              line: 1,       // anchor to sentinel line
              side: "RIGHT",
              body
            });

            // 7) Delete the original PR (issue) comment
            await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });

            core.info(
              postedVia === "file"
                ? `Threadified comment ${comment.id} as a FILE-level thread in ${filePath} and deleted the original.`
                : `Threadified comment ${comment.id} at position ${lastAddPos} in ${filePath} and deleted the original.`
            );
  cleanup_on_merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Remove __comment_threads.txt from the merge target branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const baseRef = pr.base.ref; // branch that received the merge
            const filePath = "__comment_threads.txt";

            // Try to fetch file on the base branch (it may not exist if never created/merged)
            let sha;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: filePath, ref: baseRef
              });
              if (Array.isArray(file)) throw new Error("Path is a directory");
              sha = file.sha;
            } catch (e) {
              if (e.status === 404) {
                core.info(`${filePath} not present on ${baseRef}; nothing to remove.`);
                return;
              }
              throw e;
            }

            // Delete the file from the base branch
            await github.rest.repos.deleteFile({
              owner, repo, path: filePath, message: `chore: remove ${filePath} after merge of #${pr.number}`,
              branch: baseRef, sha
            });

            core.info(`Removed ${filePath} from ${baseRef} after merge of PR #${pr.number}.`);

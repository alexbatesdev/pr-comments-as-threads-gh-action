name: Threadify PR Comments & Cleanup

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: write        # create/update/delete __comment_threads.txt
  pull-requests: write   # create review comments
  issues: write          # edit/delete original PR comments

jobs:
  threadify_comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Threadify the new PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.issue.number;
            const comment = context.payload.comment;

            // Ignore bot-authored comments to prevent loops
            if ((comment.user?.type || "") === "Bot") {
              core.info("Skip bot comment");
              return;
            }

            // Fetch PR info
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber
            });

            const headRef = pr.head.ref;                 // target branch to write the file
            const headRepoFull = pr.head.repo.full_name; // may be a fork

            // Safety: only operate when we can push to the PR branch (same repo)
            if (headRepoFull.toLowerCase() !== `${owner}/${repo}`.toLowerCase()) {
              core.warning("PR is from a fork; skipping because workflow token cannot push to the fork.");
              return;
            }

            const filePath = "__comment_threads.txt";

            // Get current file (if any)
            let existingSha = undefined;
            let existingText = "";
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: filePath, ref: headRef
              });
              if (Array.isArray(file)) throw new Error("Path is a directory");
              existingSha = file.sha;
              existingText = Buffer.from(file.content, file.encoding).toString("utf8");
            } catch (e) {
              if (e.status !== 404) throw e; // 404 = file doesn't exist yet
            }

            // Append a unix timestamp line
            const lines = existingText ? existingText.split(/\r?\n/) : [];
            const timestamp = Math.floor(Date.now() / 1000);
            lines.push(String(timestamp));
            const newText = lines.join("\n").replace(/\n?$/, "\n"); // ensure trailing newline
            const contentB64 = Buffer.from(newText, "utf8").toString("base64");

            // Commit create/update on the PR head branch
            const commitMessage = `chore: update ${filePath} for PR #${prNumber} comment ${comment.id}`;
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: filePath, message: commitMessage,
              content: contentB64, branch: headRef, sha: existingSha
            });

            // Determine line number we just added (1-based)
            const lineNumber = lines.length;

            // Refresh PR to get the new HEAD SHA that includes our commit
            const { data: prAfter } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber
            });
            const commit_id = prAfter.head.sha;

            // Build threaded review comment body (copy original)
            const body = `↪️ Mirrored from @${comment.user.login}:\n\n${comment.body}`;

            // Create an inline review comment on that line
            const review = await github.rest.pulls.createReviewComment({
              owner, repo, pull_number: prNumber,
              commit_id,
              path: filePath,
              line: lineNumber,
              side: "RIGHT",
              body
            });

            // OPTIONAL: edit original instead of deleting.
            // For your request, we delete the original PR (issue) comment:
            await github.rest.issues.deleteComment({
              owner, repo, comment_id: comment.id
            });

            core.info(`Threadified comment ${comment.id} to ${filePath}:${lineNumber} and deleted the original.`);
  cleanup_on_merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Remove __comment_threads.txt from the merge target branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const baseRef = pr.base.ref; // branch that received the merge
            const filePath = "__comment_threads.txt";

            // Try to fetch file on the base branch (it may not exist if never created/merged)
            let sha;
            try {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: filePath, ref: baseRef
              });
              if (Array.isArray(file)) throw new Error("Path is a directory");
              sha = file.sha;
            } catch (e) {
              if (e.status === 404) {
                core.info(`${filePath} not present on ${baseRef}; nothing to remove.`);
                return;
              }
              throw e;
            }

            // Delete the file from the base branch
            await github.rest.repos.deleteFile({
              owner, repo, path: filePath, message: `chore: remove ${filePath} after merge of #${pr.number}`,
              branch: baseRef, sha
            });

            core.info(`Removed ${filePath} from ${baseRef} after merge of PR #${pr.number}.`);

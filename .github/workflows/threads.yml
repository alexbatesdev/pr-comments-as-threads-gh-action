name: Threadify PR Comments & Cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ensure_threads_file:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const filePath = "~comment.threads";

            try {
              await github.rest.repos.getContent({ owner, repo, path: filePath, ref: headRef });
              core.info(`${filePath} already exists on ${headRef}`);
            } catch (e) {
              if (e.status !== 404) throw e;
              const content = "# Thread anchor – do not remove\n";
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: filePath, branch: headRef,
                message: `chore: bootstrap ${filePath} for PR #${pr.number}`,
                content: Buffer.from(content, "utf8").toString("base64")
              });
              core.info(`Created ${filePath} on ${headRef}`);
            }

  threadify_comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.issue.number;
            const comment = context.payload.comment;

            if ((comment.user?.type || "") === "Bot") {
              core.info("Skip bot comment");
              return;
            }

            // Fetch PR info
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const headRef = pr.head.ref;
            const headRepoFull = pr.head.repo.full_name;
            if (headRepoFull.toLowerCase() !== `${owner}/${repo}`.toLowerCase()) {
              core.warning("PR from fork; skipping (cannot push to fork).");
              return;
            }

            const filePath = "~comment.threads";

            // Read current file and append timestamp
            let existingSha, existingText = "";
            try {
              const { data: file } = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: headRef });
              if (Array.isArray(file)) throw new Error("Path is a directory");
              existingSha = file.sha;
              existingText = Buffer.from(file.content, file.encoding).toString("utf8");
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const lines = existingText ? existingText.split(/\r?\n/) : [];
            if (lines.length === 0) {
              lines.push("# Thread anchor – do not remove");
            } else {
              // force a diff on the anchor line
              lines[0] = "# Thread anchor – do not remove (touched at " + Date.now() + ")";
            }
            const timestamp = Math.floor(Date.now() / 1000);
            lines.push(String(timestamp) + " - " + comment.body);
            const newText = lines.join().replace(/\n?$/, "\n");
            const contentB64 = Buffer.from(newText, "utf8").toString("base64");

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: filePath, branch: headRef,
              message: `chore: update ${filePath} for PR #${prNumber} comment ${comment.id}`,
              content: contentB64, sha: existingSha
            });

            // Refresh PR to get commit ID
            const { data: prAfter } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const commit_id = prAfter.head.sha;

            // Wait a moment so the diff is updated
            await new Promise(r => setTimeout(r, 1500));

            const body = `### @\\${comment.user.login}:\n\n${comment.body}`;
            await new Promise(r => setTimeout(r, 1500));

            await github.rest.pulls.createReviewComment({
              owner, repo,
              pull_number: prNumber,
              commit_id,
              path: filePath,
              line: 1,       // anchor to sentinel line
              side: "RIGHT",
              body
            });

            // Delete the original PR (issue) comment
            await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });

            core.info(`Threadified comment ${comment.id} anchored in ${filePath}`);

  cleanup_on_merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const baseRef = pr.base.ref;
            const filePath = "~comment.threads";

            try {
              const { data: file } = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: baseRef });
              if (!Array.isArray(file)) {
                await github.rest.repos.deleteFile({
                  owner, repo, path: filePath, branch: baseRef, sha: file.sha,
                  message: `chore: remove ${filePath} after merge of #${pr.number}`
                });
                core.info(`Removed ${filePath} from ${baseRef}`);
              }
            } catch (e) {
              if (e.status === 404) {
                core.info(`No ${filePath} to remove on ${baseRef}`);
              } else {
                throw e;
              }
            }
